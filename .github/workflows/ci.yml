# CollectFlow AI continuous integration (M15). No Google, Gmail or Gemini credentials are used anywhere:
# backend tests use fakes, AI evaluations run in deterministic and simulated modes only, and the browser tests run
# against a throwaway database with fake providers. Each job has its own PostgreSQL service, so no two test runs
# share a database.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ci-only-not-secret
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_USER: collectflow
  POSTGRES_PASSWORD: ci-password
  GEMINI_API_KEY: ""
  GOOGLE_SHEETS_SPREADSHEET_ID: ""
  GMAIL_READ_ENABLED: "false"

jobs:
  backend:
    name: Backend (checks, import contracts, AI eval harness, full test suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_DB: collectflow_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collectflow
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: collectflow_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collectflow" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are consistent with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Import contracts (scheduled code cannot reach Gmail send)
        run: lint-imports
      - name: AI evaluation datasets and screens (no model calls)
        run: python manage.py run_ai_evals --mode deterministic
      - name: AI evaluation harness on simulated answers (not model quality)
        run: |
          python manage.py run_ai_evals --mode recorded --suite replies --responses evals/recorded/simulated-replies.json
          python manage.py run_ai_evals --mode recorded --suite drafting --responses evals/recorded/simulated-drafting.json
      - name: Full backend test suite (PostgreSQL, one process)
        run: python manage.py test --noinput --parallel 1 -v 2

  frontend:
    name: Frontend (type-check, lint, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

  e2e:
    name: Browser tests (Playwright, fake providers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_DB: collectflow_e2e
      PYTHON: python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collectflow
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collectflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install the Chromium version pinned by @playwright/test
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests
        run: npx playwright test
        working-directory: frontend
      - name: Keep the report and traces when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
