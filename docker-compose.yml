# Local stack: PostgreSQL 16, Django API, background worker, Next.js UI.
#   docker compose up -d --build
# Configuration comes from backend/.env (see backend/.env.example; another file can be used with
# COLLECTFLOW_ENV_FILE=path). Every port is published on 127.0.0.1 only. There is no Redis:
# PostgreSQL is both the state store and the job queue.
name: collectflow

services:
  db:
    image: postgres:16-alpine
    # The image reads POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD from this file.
    env_file: ${COLLECTFLOW_ENV_FILE:-./backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port for running Django, tests or psql outside Compose (5432 is often taken).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
    env_file: ${COLLECTFLOW_ENV_FILE:-./backend/.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/credentials:/app/credentials
      - ./backend/logs:/app/logs
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
    env_file: ${COLLECTFLOW_ENV_FILE:-./backend/.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: python manage.py run_worker
    volumes:
      - ./backend/credentials:/app/credentials
      - ./backend/logs:/app/logs
    depends_on:
      api:
        condition: service_healthy  # the API applies migrations first
    stop_signal: SIGTERM  # the worker finishes its current job, then exits
    stop_grace_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
